name: Reusable Tests

# Framework demos (examples/) are NOT part of this suite.
# Run them manually with optional extras:
#   uv run --extra examples-langgraph python examples/langgraph/demo_tool_guardrail.py
#   uv run --extra examplescrewai    python examples/crewai/demo_spec_drift.py

on:
  workflow_call:

permissions:
  contents: read

env:
  SDD_ENFORCE_PIPELINE_CORRECT: "1"

jobs:
  artifact-gate:
    name: Artifact Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Bootstrap Providence CLI
        uses: ./.github/actions/bootstrap-providence-cli

      - name: Environment boundary preflight (tests)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py test-isolation-preflight --context test --mode warn
          uv run python tools/ci/environment_gates.py telemetry-path-scope-check --context test --mode enforce

      - name: Validate governance contract golden
        shell: bash
        run: |
          uv run pytest -q \
            tests/contract/test_governance_schema.py::TestGovernanceCoreGoldenFile::test_structure_matches_golden

      - name: Enforce golden snapshot policy matrix
        shell: bash
        run: |
          uv run python tools/ci/check_golden_policy.py --mode block

      - name: Enforce core/compiler/runtime contract invariants
        shell: bash
        run: |
          mkdir -p .artifacts
          uv run python tools/ci/check_core_compiler_runtime_contract.py \
            --mode enforce \
            --json-out .artifacts/core_compiler_runtime_contract_gate.json

      - name: Repository .providence mutation guard
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py repo-providence-mutation-guard --context test --mode enforce

      - name: Runtime/seed drift check
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py runtime-seed-drift-check --context test --mode enforce

  cli-gate:
    name: CLI Gate (${{ matrix.os }} / Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.required == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            required: true
          - os: windows-latest
            python-version: "3.11"
            required: true
          - os: ubuntu-latest
            python-version: "3.12"
            required: true
          - os: windows-latest
            python-version: "3.12"
            required: true
          - os: ubuntu-latest
            python-version: "3.13"
            required: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Bootstrap Providence CLI
        uses: ./.github/actions/bootstrap-providence-cli

      - name: Environment boundary preflight (tests)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py test-isolation-preflight --context test --mode warn
          uv run python tools/ci/environment_gates.py telemetry-path-scope-check --context test --mode enforce

      - name: Report non-blocking channel
        if: matrix.required == false
        shell: bash
        run: |
          echo "Running desired/non-blocking compatibility lane for Python ${{ matrix.python-version }} on ${{ matrix.os }}."

      - name: Run CLI cross-platform regression tests
        shell: bash
        run: |
          uv run pytest -q \
            packages/interfaces/providence_cli/tests/test_governance_output_snapshots.py \
            packages/core/providence_core/tests/execution/test_guardrail_code_review.py

      - name: Repository .providence mutation guard
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py repo-providence-mutation-guard --context test --mode enforce

      - name: Runtime/seed drift check
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py runtime-seed-drift-check --context test --mode enforce

  skills-commands-gate:
    name: Skills/Commands Gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Bootstrap Providence CLI
        uses: ./.github/actions/bootstrap-providence-cli

      - name: Environment boundary preflight (tests)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py test-isolation-preflight --context test --mode warn
          uv run python tools/ci/environment_gates.py telemetry-path-scope-check --context test --mode enforce

      - name: Validate prompt and CI command policy
        shell: bash
        run: |
          uv run python tools/ci/check_codex_sdd_ask.py
          uv run python tools/ci/check_no_sdd_ci_commands.py
          uv run python tools/ci/check_no_legacy_ai_paths.py
          uv run python tools/ci/check_enforcement_ladder_consistency.py
          uv run python tools/ci/check_enforcement_threshold_signoff.py
          uv run python tools/ci/check_observability_contract.py
          uv run python tools/ci/check_runbook_hardening_protocol.py

      - name: Enforce global print policy (T201)
        shell: bash
        run: |
          uv run ruff check packages tools tests --select T201

      - name: Enforce text I/O encoding policy (blocking)
        shell: bash
        run: |
          uv run python tools/ci/check_text_io_encoding.py

      - name: Analyze text I/O migration baseline (non-blocking)
        shell: bash
        run: |
          uv run python tools/ci/check_text_io_helpers_critical.py || true
          uv run python tools/ci/check_text_io_centralization.py || true
          uv run python tools/ci/check_encoding_edge_marker_policy.py || true

      - name: Validate skills/commands contracts
        shell: bash
        run: |
          uv run pytest -q \
            packages/interfaces/providence_cli/tests/test_skills_bootstrap_command.py \
            packages/interfaces/providence_cli/tests/test_skills_core_command.py \
            packages/interfaces/providence_cli/tests/test_skills_learning_command.py \
            packages/interfaces/providence_cli/tests/test_skills_run_command.py \
            packages/interfaces/providence_cli/tests/test_skills_sync_contract.py \
            packages/interfaces/providence_cli/tests/test_skills_layering.py

      - name: Build providence_cli reliability digest (warnings/skips)
        shell: bash
        run: |
          mkdir -p .artifacts
          uv run pytest -q packages/interfaces/providence_cli/tests -ra 2>&1 | tee .artifacts/providence_cli_pytest.log
          uv run python tools/ci/providence_cli_reliability_digest.py \
            --log .artifacts/providence_cli_pytest.log \
            --json-out .artifacts/providence_cli_reliability_digest.json \
            --md-out .artifacts/providence_cli_reliability_digest.md \
            --max-warnings 0
          uv run python tools/ci/enforcement_ladder_digest.py \
            --json-out .artifacts/enforcement_ladder_digest.json \
            --md-out .artifacts/enforcement_ladder_digest.md \
            --mode report

      - name: Upload providence_cli reliability digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: providence-cli-reliability-digest
          path: |
            .artifacts/providence_cli_reliability_digest.json
            .artifacts/providence_cli_reliability_digest.md
            .artifacts/providence_cli_pytest.log
            .artifacts/enforcement_ladder_digest.json
            .artifacts/enforcement_ladder_digest.md

      - name: Repository .providence mutation guard
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py repo-providence-mutation-guard --context test --mode enforce

      - name: Runtime/seed drift check
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py runtime-seed-drift-check --context test --mode enforce

      - name: Enforce registry reconciliation (drift check)
        shell: bash
        run: |
          uv run python -m providence_cli governance reconcile-registries --check

  seeds-gate:
    name: Seeds Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Bootstrap Providence CLI
        uses: ./.github/actions/bootstrap-providence-cli

      - name: Environment boundary preflight (tests)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py test-isolation-preflight --context test --mode warn
          uv run python tools/ci/environment_gates.py telemetry-path-scope-check --context test --mode enforce

      - name: Run seed generation regressions
        shell: bash
        run: |
          uv run pytest -q \
            packages/interfaces/providence_wizard/tests/test_seedlings_generators.py \
            tests/integration/wizard/test_seedlings_e2e.py

      - name: Repository .providence mutation guard
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py repo-providence-mutation-guard --context test --mode enforce

      - name: Runtime/seed drift check
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py runtime-seed-drift-check --context test --mode enforce

  coverage-strict:
    name: Coverage Gates (core ≥ 90%, features/interfaces ≥ 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Bootstrap Providence CLI
        uses: ./.github/actions/bootstrap-providence-cli

      - name: Environment boundary preflight (tests)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py test-isolation-preflight --context test --mode warn
          uv run python tools/ci/environment_gates.py telemetry-path-scope-check --context test --mode enforce

      - name: Run strict per-layer coverage gates
        shell: bash
        run: make coverage-strict

      - name: Repository .providence mutation guard
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py repo-providence-mutation-guard --context test --mode enforce

      - name: Runtime/seed drift check
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py runtime-seed-drift-check --context test --mode enforce

  runtime-dev-smoke:
    name: Runtime/Dev Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Bootstrap Providence CLI
        uses: ./.github/actions/bootstrap-providence-cli

      - name: Environment boundary preflight (tests)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py test-isolation-preflight --context test --mode warn
          uv run python tools/ci/environment_gates.py telemetry-path-scope-check --context test --mode enforce

      - name: Validate runtime health
        shell: bash
        run: |
          uv run python -m providence_cli runtime status --force

      - name: Validate governance integrity
        shell: bash
        run: |
          uv run python -m providence_cli governance validate --skip-handshake

      - name: Repository .providence mutation guard
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py repo-providence-mutation-guard --context test --mode enforce

      - name: Runtime/seed drift check
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py runtime-seed-drift-check --context test --mode enforce

  container-integrity:
    name: Sovereign Container Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sync Docker ignore rules
        run: cp infrastructure/docker/.dockerignore .dockerignore

      - name: Build Sovereign Container
        run: |
          docker buildx build --load -t providence:latest -f infrastructure/docker/Dockerfile .

      - name: Verify Safety-Mode Boot (No Keyring)
        run: |
          # Container must boot in safety mode and exit gracefully
          docker run --rm providence:latest | grep "SAFETY-MODE ACTIVE"

      - name: Environment boundary preflight (tests)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py test-isolation-preflight --context test --mode warn

      - name: Run Hermetic Health Suite
        run: |
          # Run full health suite inside the container
          docker run --rm providence:latest make check

      - name: Clean up staged .dockerignore
        if: always()
        run: rm -f .dockerignore

      - name: Repository .providence mutation guard
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py repo-providence-mutation-guard --context test --mode enforce

      - name: Runtime/seed drift check
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py runtime-seed-drift-check --context test --mode enforce

  coverage-upload:
    name: Coverage Upload (Codecov)
    runs-on: ubuntu-latest
    needs: coverage-strict
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Bootstrap Providence CLI
        uses: ./.github/actions/bootstrap-providence-cli

      - name: Environment boundary preflight (tests)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py test-isolation-preflight --context test --mode warn
          uv run python tools/ci/environment_gates.py telemetry-path-scope-check --context test --mode enforce

      - name: Generate unified coverage report
        shell: bash
        run: |
          uv run pytest packages tests --cov=packages --cov-report=xml -q

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Repository .providence mutation guard
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py repo-providence-mutation-guard --context test --mode enforce

      - name: Runtime/seed drift check
        if: always()
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py runtime-seed-drift-check --context test --mode enforce

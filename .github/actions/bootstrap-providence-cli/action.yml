name: Bootstrap Providence CLI
description: Initialize Providence workspace using uv (uv must already be installed)

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: "1.26"
        cache: true
        cache-dependency-path: tools/sdd-compile/go.sum

    - name: Install all dependencies (includes sdd-compile build)
      shell: bash
      run: make install

    - name: Verify CLI module
      shell: bash
      run: uv run python -m providence_cli --help > /dev/null

    - name: Configure isolated Providence output
      shell: bash
      run: |
        if [ -n "${GITHUB_ENV:-}" ] && [ -z "${SDD_TEST_OUTPUT_DIR:-}" ]; then
          output_dir="${RUNNER_TEMP:-/tmp}/sdd-test-output"
          mkdir -p "$output_dir"
          echo "SDD_TEST_OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
        fi

    - name: Initialize Providence Workspace
      shell: bash
      run: uv run python -m providence_cli init --type master --force

    - name: Compile governance artifacts
      shell: bash
      run: uv run python -m providence_cli governance compile

    - name: Verify compiled artifacts exist
      shell: bash
      run: |
        test -f .providence/compiled/governance-core.json || \
          (echo "ERROR: .providence/compiled/governance-core.json missing" && exit 1)
        test -f .providence/compiled/governance-core.compiled.msgpack || \
          (echo "ERROR: .providence/compiled/governance-core.compiled.msgpack missing" && exit 1)
        echo "✓ Compiled artifacts verified at .providence/compiled/."
